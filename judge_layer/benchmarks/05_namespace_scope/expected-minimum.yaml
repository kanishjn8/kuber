kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: minimum, namespace: team-a}
rules: [{apiGroups: [""], resources: [pods], verbs: [list]}]
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: minimum, namespace: team-a}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: minimum}
subjects: [{kind: ServiceAccount, name: pod-reader, namespace: team-a}]
