kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: minimum, namespace: payments}
rules:
  - {apiGroups: [""], resources: [configmaps], verbs: [get], resourceNames: [app-config, failover-config]}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: minimum, namespace: payments}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: minimum}
subjects: [{kind: ServiceAccount, name: named-reader, namespace: payments}]
