kind: ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: broad-workload-role}
rules: [{apiGroups: ["*"], resources: ["*"], verbs: ["*"]}]
---
kind: ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: broad-workload-binding}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: broad-workload-role}
subjects: [{kind: ServiceAccount, name: hidden-path, namespace: payments}]

