kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: minimum, namespace: controllers}
rules:
  - {apiGroups: [coordination.k8s.io], resources: [leases], verbs: [get, update], resourceNames: [app-leader]}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: minimum, namespace: controllers}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: minimum}
subjects: [{kind: ServiceAccount, name: leader, namespace: controllers}]
