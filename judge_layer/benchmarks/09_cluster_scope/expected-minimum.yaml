kind: Role
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: minimum, namespace: storefront}
rules:
  - {apiGroups: [""], resources: [services], verbs: [get], resourceNames: [catalog]}
  - {apiGroups: [""], resources: [services], verbs: [list]}
---
kind: RoleBinding
apiVersion: rbac.authorization.k8s.io/v1
metadata: {name: minimum, namespace: storefront}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: minimum}
subjects: [{kind: ServiceAccount, name: service-reader, namespace: storefront}]
