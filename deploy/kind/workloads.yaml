apiVersion: v1
kind: ServiceAccount
metadata: {name: api-gateway-sa, namespace: kuber-sandbox}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: auth-service-sa, namespace: kuber-sandbox}
---
apiVersion: v1
