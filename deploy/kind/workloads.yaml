---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: kuber-sandbox
  labels: {app.kubernetes.io/name: api-gateway}
  annotations:
    kuber.dev/source-path: examples/service_catalog/api_gateway
    kuber.dev/important-paths: service.py,service-context.yaml
    kuber.dev/verification-profile: api-gateway
    kuber.dev/dependencies: auth-service,order-service
spec:
  replicas: 1
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway, app.kubernetes.io/name: api-gateway}}
    spec:
      serviceAccountName: api-gateway-sa
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        -
          name: service
          image: kuber-reference-workload:dev
          imagePullPolicy: Never
          ports: [{containerPort: 8080}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 300m, memory: 192Mi}
          env:
            - {name: SERVICE_ID, value: api-gateway}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
          readinessProbe: {httpGet: {path: /healthz, port: 8080}, periodSeconds: 2}
          livenessProbe: {httpGet: {path: /healthz, port: 8080}, initialDelaySeconds: 10}
---
