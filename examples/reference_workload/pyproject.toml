[project]
name = "kuber-reference-workload"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "kubernetes>=30.1.0",
  "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reference_workload"]

[dependency-groups]
dev = ["pytest>=8.3.0"]
