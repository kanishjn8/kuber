[project]
name = "kuber"
version = "0.1.0"
description = "An agentic least-privilege compiler for Kubernetes workloads"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
  "PyYAML>=6.0.2",
  "python-dotenv>=1.0.1",
  "typer>=0.12.5",
]

[project.optional-dependencies]
demo = ["kubernetes>=30.1.0"]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0.0"]

[project.scripts]
kuber = "kuber.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kuber", "rules_engine", "agent_layer", "judge_layer", "demo_layer"]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["rules_engine", "agent_layer", "judge_layer"]
