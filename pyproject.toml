[project]
name = "kuber"
version = "0.1.0"
description = "An agentic least-privilege compiler for Kubernetes workloads"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "langgraph>=1.0.0,<2.0.0",
  "langgraph-checkpoint-sqlite>=3.0.0,<4.0.0",
  "PyYAML>=6.0.2",
  "python-dotenv>=1.0.1",
  "rich>=13.9.0",
  "typer>=0.12.5",
]

[project.optional-dependencies]
distributed = ["aiokafka>=0.12.0", "redis>=5.2.0"]
kubernetes = [
  "aiokafka>=0.12.0",
  "fastapi>=0.115.0",
  "kubernetes>=30.1.0",
  "redis>=5.2.0",
]

[project.scripts]
kuber = "kuber_cli.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
  "kuber_cli",
  "rules_engine",
  "agent_layer",
  "event_layer",
  "context_layer",
  "judge_layer",
  "kubernetes_runtime",
]

[tool.uv]
default-groups = ["dev"]

[dependency-groups]
dev = [
  "mypy>=1.15.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.11.0",
  "types-PyYAML>=6.0.12.20241230",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["examples/reference_workload/src"]

[tool.coverage.run]
source = [
  "rules_engine",
  "agent_layer",
  "event_layer",
  "context_layer",
  "judge_layer",
  "kubernetes_runtime",
  "kuber_cli",
  "reference_workload",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["artifacts"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = ["examples/reference_workload/src"]

[[tool.mypy.overrides]]
module = ["kubernetes", "kubernetes.*"]
ignore_missing_imports = true
